<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>CriaHub · Painel</title>
<meta name="theme-color" content="#420725">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --vinho:#420725; --vinho-2:#5A0F33; --rosa:#F4C9D8; --rosa-2:#FBE7EE; --rec:#FF5C8A;
  --bg:#FAF6F7; --card:#fff; --ink:#22141A; --muted:#7A5A64; --line:#EEDFE4; --ok:#1F8A5B; --warn:#B25B00;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; --body:Manrope, ui-sans-serif, system-ui, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* topo */
.top{background:var(--vinho);color:#fff;position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top,0)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.logo{font:800 24px/1 var(--display);letter-spacing:-.035em;display:inline-flex;align-items:baseline;text-decoration:none;white-space:nowrap;flex:none}
.logo .c{color:var(--rosa)} .logo .h{color:#fff}
.ii{position:relative;display:inline-block}
.ii b{position:absolute;left:50%;top:-.12em;width:.24em;height:.24em;margin-left:-.12em;border-radius:50%;background:var(--rec)}
.top .tag{font:700 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--rosa);border:1px solid rgb(244 201 216 / .35);border-radius:999px;padding:5px 9px}
.top .sp{flex:1}
.ib{border:0;background:rgb(255 255 255 / .1);color:#fff;border-radius:10px;min-height:38px;padding:0 12px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.ib:hover{background:rgb(255 255 255 / .18)}
.ib[aria-pressed=true]{background:var(--rosa);color:var(--vinho)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;color:rgb(255 255 255 / .75);font-weight:700;padding:9px 14px;border-radius:999px;white-space:nowrap}
.tabs button[aria-current=page]{background:#fff;color:var(--vinho)}

main{padding:20px 0 60px}
h1{font:800 28px/1.1 var(--display);letter-spacing:-.02em;margin:0 0 4px}
h2{font:800 19px/1.2 var(--display);letter-spacing:-.01em;margin:0}
.sub{color:var(--muted);font-size:13.5px;margin:0}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}

/* números */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi .l{font-size:12.5px;font-weight:700;color:var(--muted)}
.kpi .v{font:800 30px/1.05 var(--display);letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.hi{background:var(--vinho);border-color:var(--vinho);color:#fff}
.kpi.hi .l,.kpi.hi .d{color:var(--rosa)}

/* gráfico de barras por dia */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--vinho);border-color:var(--vinho);color:#fff}
.bars{display:flex;align-items:flex-end;gap:3px;height:170px;padding-top:22px;position:relative}
.bars .b{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;position:relative;border:0;background:none;padding:0}
.bars .b i{display:block;width:100%;background:var(--rosa);border-radius:5px 5px 2px 2px;min-height:2px}
.bars .b:hover i,.bars .b.on i{background:var(--vinho)}
.bars .b.today i{background:var(--rec)}
.bars-x{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
.tip{font-size:13px;color:var(--muted);margin-top:10px;min-height:20px}
.tip b{color:var(--ink)}

/* ranking de telas */
.rank{display:flex;flex-direction:column;gap:9px}
.rank .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.rank .n{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .m{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.rank .t{grid-column:1/-1;height:8px;border-radius:99px;background:var(--rosa-2);overflow:hidden}
.rank .t i{display:block;height:100%;background:var(--vinho);border-radius:99px}
.rank.low .t i{background:var(--rec)}
.two{display:grid;gap:12px}
@media (min-width:760px){.two{grid-template-columns:1fr 1fr}}

/* filtros */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
.search{flex:1 1 220px;min-height:42px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff}
select.sel{min-height:42px;border:1px solid var(--line);border-radius:12px;padding:0 10px;background:#fff;font-weight:600}
.btn{border:0;border-radius:12px;min-height:42px;padding:0 16px;font-weight:800;background:var(--vinho);color:#fff}
.btn.ghost{background:#fff;color:var(--vinho);border:1px solid var(--line)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.danger{background:#fff;color:#B4232C;border:1px solid #F1C6CA}
.btn.danger.sure{background:#B4232C;color:#fff;border-color:#B4232C}
.btn:disabled{opacity:.5;cursor:default}

/* lista de pessoas */
.list{display:flex;flex-direction:column;gap:10px}
.person{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.person > button.head{all:unset;box-sizing:border-box;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:14px;cursor:pointer}
.person > button.head:focus-visible{outline:2px solid var(--vinho);outline-offset:-2px;border-radius:16px}
.av{width:40px;height:40px;border-radius:50%;background:var(--rosa-2);color:var(--vinho);display:grid;place-items:center;font:800 16px/1 var(--display)}
.nm{font-weight:800;font-size:15px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.em{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.lg-only{display:none}@media (min-width:600px){.lg-only{display:inline}}
@media (max-width:380px){.top .tag{display:none}}
.right{text-align:right;font-size:12.5px;color:var(--muted);white-space:nowrap}
.right b{display:block;font:800 17px/1.1 var(--display);color:var(--ink)}
.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 8px;background:var(--rosa-2);color:var(--vinho)}
.pill.pro{background:var(--vinho);color:#fff}
.pill.warn{background:#FFF1E0;color:var(--warn)}
.pill.ok{background:#E3F5EC;color:var(--ok)}
.pill.me{background:#EFE9FF;color:#4B2BA8}
.det{border-top:1px solid var(--line);padding:14px;display:grid;gap:16px;background:#FFFCFD}
.det h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.counts{display:flex;flex-wrap:wrap;gap:6px}
.counts span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}
.counts b{font-variant-numeric:tabular-nums}
.planbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.planbox input{flex:1 1 200px;min-height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff}
.seg{display:inline-flex;background:var(--rosa-2);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:7px 14px;font-weight:800;font-size:13px;color:var(--vinho)}
.seg button[aria-pressed=true]{background:var(--vinho);color:#fff}
.pain{background:var(--rosa-2);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.links a{font-size:13px;font-weight:700;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.wl{padding:14px}
.wl .row1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.more{display:block;margin:14px auto 0}

/* respostas "o que mais atrapalha" */
.quotes{display:grid;gap:8px}
@media (min-width:760px){.quotes{grid-template-columns:1fr 1fr}}
.quote{background:#fff;border:1px solid var(--line);border-left:4px solid var(--rosa);border-radius:12px;padding:10px 12px;font-size:14px}
.quote small{display:block;color:var(--muted);font-size:12px;margin-top:4px}

.empty{text-align:center;color:var(--muted);padding:30px 16px;background:#fff;border:1px dashed var(--line);border-radius:16px}
.state{min-height:70vh;display:grid;place-items:center;padding:24px}
.state .box{max-width:380px;width:100%;text-align:center}
.state h1{color:var(--vinho)}
.state form{display:flex;flex-direction:column;gap:10px;margin-top:18px;text-align:left}
.state label{font-size:13px;font-weight:800;display:flex;flex-direction:column;gap:5px}
.state input{min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;background:#fff}
.err{color:#B4232C;font-weight:700;font-size:14px;min-height:20px}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}
body.disc .pv{filter:blur(6px);user-select:none}
.loading{color:var(--muted);padding:40px 0;text-align:center}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--rec);color:#fff;font-size:11px;font-weight:800;margin-left:6px;vertical-align:1px}
.att{display:grid;gap:8px;margin-top:16px}
@media (min-width:760px){.att{grid-template-columns:repeat(4,minmax(0,1fr))}}
.att button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px}
.att button:focus-visible{outline:2px solid var(--vinho)}
.att .dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.att .hot .dot{background:var(--rec)}
.att b{font:800 20px/1 var(--display);margin-left:auto}
textarea.ta{width:100%;min-height:80px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;resize:vertical}
.fgrid{display:grid;gap:10px}
@media (min-width:760px){.fgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fgrid label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:800}
.fgrid input,.fgrid select{min-height:42px;border:1px solid var(--line);border-radius:12px;padding:0 10px;background:#fff;font-weight:600}
.msg{white-space:pre-wrap;font-size:15px;margin-top:8px}
.reply{background:#F3EEFF;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px;white-space:pre-wrap}
.err-row{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;word-break:break-word}
.pay{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px 14px}
.pay b.v{font:800 17px/1 var(--display);white-space:nowrap}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top" id="top" hidden>
  <div class="wrap">
    <a class="logo" href="/" aria-label="Abrir o CriaHub"><span class="c">cr<span class="ii">ı<b></b></span>a</span><span class="h">hub</span></a>
    <span class="tag">Fundadora</span>
    <span class="sp"></span>
    <button class="ib" id="disc" aria-pressed="false" title="Borra e-mails e telefones, pra tirar print ou mostrar a tela"><span class="lg-only">Modo</span>discreto</button>
    <button class="ib" id="reload" aria-label="Atualizar">↻</button>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs">
    <button data-tab="geral" aria-current="page">Visão geral</button>
    <button data-tab="creators">Creators</button>
    <button data-tab="feedback">Feedback<span class="badge" id="fbBadge" hidden></span></button>
    <button data-tab="financas">Finanças</button>
    <button data-tab="lista">Lista de espera</button>
  </nav></div>
</header>
<main id="main" class="wrap"><div class="loading">Carregando…</div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* CriaHub · painel da fundadora (criahub.app.br/admin)
   Usa o mesmo login do app. Quem decide se a pessoa pode ver é o banco (supabase/admin.sql):
   todas as funções conferem se ela está em private.admins. Pra qualquer outra conta, nada aparece. */
(() => {
  const CFG = window.CRIAHUB_ADMIN_CFG || { url: 'https://dvzfllqcgozecvhodygz.supabase.co', key: 'sb_publishable_a-svz0y1Hv6AaeP3J7om9g_Qot6D66F' };
  const sb = window.CRIAHUB_ADMIN_SB || (window.supabase && window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true } }));
  const $ = id => document.getElementById(id);
  const main = $('main');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const nf = n => Number(n || 0).toLocaleString('pt-BR');
  const toast = t => { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2200); };

  const SCREENS = {
    'inicio': 'Início', 'radar': 'Radar UGC',
    'rotina.hoje': 'Rotina › Meu dia', 'rotina.metas': 'Rotina › Metas', 'rotina.habitos': 'Rotina › Hábitos', 'rotina.semana': 'Rotina › Semana', 'rotina.conquistas': 'Rotina › Conquistas',
    'marcas.clientes': 'Marcas › Clientes', 'marcas.contas': 'Marcas › Contas', 'marcas.prospec': 'Marcas › Prospecção', 'marcas.permutas': 'Marcas › Permutas', 'marcas.contratos': 'Marcas › Contratos', 'marcas.licencas': 'Marcas › Licenças', 'marcas.kit': 'Marcas › Mídia kit',
    'agenda.calendario': 'Agenda › Calendário', 'agenda.entregas': 'Agenda › Entregas', 'agenda.datas': 'Agenda › Datas comerciais',
    'estudio.briefing': 'Estúdio › Briefing', 'estudio.alta': 'Estúdio › Em alta', 'estudio.revisor': 'Estúdio › Revisor', 'estudio.gravar': 'Estúdio › Gravar', 'estudio.lote': 'Estúdio › Em lote', 'estudio.ideias': 'Estúdio › Ideias', 'estudio.ganchos': 'Estúdio › Ganchos', 'estudio.erros': 'Estúdio › Erros',
    'financeiro.marcas': 'Finanças › Marcas', 'financeiro.dolar': 'Finanças › US$ / €', 'financeiro.rendas': 'Finanças › Rendas', 'financeiro.gastos': 'Finanças › Gastos', 'financeiro.ano': 'Finanças › Ano', 'financeiro.meta': 'Finanças › Meta', 'financeiro.preco': 'Finanças › Preço', 'financeiro.notas': 'Finanças › Notas fiscais'
  };
  const scr = k => SCREENS[k] || k || '—';
  const COLS = { brands: 'marcas', deliveries: 'entregas', ideas: 'ideias', tasks: 'tarefas', payments: 'pagamentos', extras: 'outras rendas', leads: 'prospecções', contracts: 'contratos', goals: 'metas', habits: 'hábitos', hlog: 'registros de hábito', briefs: 'briefings', feedbacks: 'feedbacks', expenses: 'gastos', perms: 'permutas', notes: 'notas', accounts: 'contas de marca', retros: 'retrospectivas', videos: 'vídeos' };
  const KIND_APP = { ugc: 'faz UGC', canvas: 'faz UGC Tech Canvas', rendas: 'tem outras rendas', comecando: 'está começando' };
  const waNum = v => { const w = String(v || '').replace(/\D/g, ''); return w ? (w.length <= 11 ? '55' + w : w) : ''; };
  const KINDS = { ugc: 'UGC tradicional', tech: 'UGC Tech Canvas', ambos: 'Os dois', comecando: 'Começando' };

  const dur = secsOrMins => { const m = Math.round(secsOrMins); if (m < 1) return '0 min'; if (m < 60) return m + ' min'; const h = Math.floor(m / 60), r = m % 60; return h + 'h' + (r ? ' ' + String(r).padStart(2, '0') : ''); };
  const dt = d => !d ? '—' : /^\d{4}-\d{2}-\d{2}$/.test(String(d)) ? String(d).slice(8, 10) + '/' + String(d).slice(5, 7) + '/' + String(d).slice(2, 4) : new Date(d).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', timeZone: 'America/Sao_Paulo' });
  const dtt = d => d ? new Date(d).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' }) : '—';
  const dayLbl = d => { const [y, m, dd] = String(d).slice(0, 10).split('-'); return dd + '/' + m; };
  const todayStr = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
  const ago = day => { if (!day) return 'nunca usou'; const t = new Date(todayStr()), d = new Date(String(day).slice(0, 10)); const n = Math.round((t - d) / 864e5); return n <= 0 ? 'hoje' : n === 1 ? 'ontem' : 'há ' + n + ' dias'; };
  const daysSince = day => day ? Math.round((new Date(todayStr()) - new Date(String(day).slice(0, 10))) / 864e5) : Infinity;
  const initials = s => (String(s || '?').trim()[0] || '?').toUpperCase();

  const st = { tab: 'geral', ov: null, daily: [], screens: [], users: null, wl: null, metric: 'active', sel: -1,
    uq: '', uf: 'todas', us: 'recentes', open: null, uscr: {}, wq: '', wk: 'todos', wlim: 50, sure: null, plan: {},
    fb: [], errs: [], rev: [], ff: 'novo', fopen: null, showErr: false };
  try { const t = sessionStorage.getItem('criahub:admtab'); if (t) st.tab = t; } catch (_) {}
  try { if (localStorage.getItem('criahub:admdisc') === '1') { document.body.classList.add('disc'); $('disc').setAttribute('aria-pressed', 'true'); } } catch (_) {}

  /* ---------- entrada ---------- */
  function showLogin(msg) {
    $('top').hidden = true;
    main.innerHTML = `<div class="state"><div class="box">
      <span class="logo" style="font-size:48px"><span class="c">cr<span class="ii">ı<b></b></span>a</span><span class="h" style="color:var(--vinho)">hub</span></span>
      <h1 style="margin-top:14px">Painel da fundadora</h1><p class="sub">Entre com a mesma conta que você usa no CriaHub.</p>
      <form id="lf"><label>E-mail<input name="email" type="email" autocomplete="username" required></label>
      <label>Senha<input name="pass" type="password" autocomplete="current-password" required></label>
      <div class="err" id="lerr">${esc(msg || '')}</div><button class="btn" type="submit">Entrar</button></form></div></div>`;
    $('lf').addEventListener('submit', async e => {
      e.preventDefault(); const f = e.target; f.querySelector('button').disabled = true; $('lerr').textContent = '';
      const { error } = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.pass.value });
      if (error) { $('lerr').textContent = 'E-mail ou senha não conferem.'; f.querySelector('button').disabled = false; return; }
      start();
    });
  }
  function showBlocked(kind) {
    $('top').hidden = true;
    const setup = kind === 'setup';
    main.innerHTML = `<div class="state"><div class="box"><h1>${setup ? 'Falta um passo' : 'Esse espaço é só da fundadora'}</h1>
      <p class="sub">${setup ? 'O painel ainda não está ligado no banco (ou ganhou partes novas). Rode a versão mais nova do arquivo <b>supabase/admin.sql</b> no SQL Editor do Supabase e atualize esta página.' : 'Você entrou com uma conta que não é de admin.'}</p>
      <div class="links" style="justify-content:center;margin-top:18px"><a href="/">Voltar ao CriaHub</a>${setup ? '' : '<a href="#" id="out">Entrar com outra conta</a>'}</div></div></div>`;

  async function start() {
    if (!sb) { main.innerHTML = '<div class="empty">Sem conexão. Confere a internet e atualiza a página.</div>'; return; }
    const { data } = await sb.auth.getSession();
    if (!data || !data.session) return showLogin();
    const r = await sb.rpc('is_admin');
    if (r.error) return showBlocked(/is_admin|function|schema cache/i.test(r.error.message) ? 'setup' : 'no');
    if (r.data !== true) return showBlocked('no');
    $('top').hidden = false;

  async function loadAll() {
    main.innerHTML = '<div class="loading">Carregando…</div>';
    const [ov, daily, screens, users, wl, fb, errs, rev] = await Promise.all([
      sb.rpc('admin_overview'), sb.rpc('admin_daily', { p_days: 30 }), sb.rpc('admin_screens', { p_days: 30 }), sb.rpc('admin_users'), sb.rpc('admin_waitlist'),
      sb.rpc('admin_feedback'), sb.rpc('admin_errors'), sb.rpc('admin_revenue')
    ]);
    if ([fb, errs, rev].some(x => x.error && /admin_feedback|admin_errors|admin_revenue|function|schema cache/i.test(x.error.message))) { showBlocked('setup'); return; }
    const bad = [ov, daily, screens, users, wl, fb, errs, rev].find(x => x.error);
    if (bad) { main.innerHTML = `<div class="empty">Não consegui carregar agora (${esc(bad.error.message)}). Tenta atualizar.</div>`; return; }

    st.fb = fb.data || []; st.errs = errs.data || []; st.rev = rev.data || [];
    st.sel = st.daily.length - 1;
    render();

  function finStats() {
    const today = todayStr(), mk = d => String(d).slice(0, 7), thisM = today.slice(0, 7);

    const R = st.rev || [], sum = L => L.reduce((a, r) => a + Number(r.amount || 0), 0);
    const pros = (st.users || []).filter(u => u.plan === 'pro' && !u.is_admin);
    const active = pros.filter(u => !u.plan_until || String(u.plan_until).slice(0, 10) >= today);
    const overdue = pros.filter(u => u.plan_until && String(u.plan_until).slice(0, 10) < today);
    const soon = active.filter(u => u.plan_until && daysUntil(u.plan_until) <= 7);
    const mrr = active.reduce((a, u) => { const last = R.find(r => r.user_id === u.user_id && r.period !== 'avulso'); return a + (last ? Number(last.amount) / (last.period === 'anual' ? 12 : 1) : 0); }, 0);
    return { month: sum(R.filter(r => mk(r.paid_at) === thisM)), last: sum(R.filter(r => mk(r.paid_at) === lastM)), total: sum(R), mrr, active, overdue, soon, thisM };

      <div class="chips" style="margin-bottom:10px">${[['novo', 'Novos'], ['vendo', 'Vendo'], ['resolvido', 'Resolvidos'], ['todos', 'Todos']].map(([k, l]) => `<button class="chip" data-ff="${k}" aria-pressed="${st.ff === k}">${l} · ${nf(n(k))}</button>`).join('')}</div>
      <p class="sub" style="margin-bottom:14px">${byKind.map(([k, v]) => `${FBK[k]}: <b>${nf(v)}</b>`).join(' · ')}</p>
      <div class="list">${L.length ? L.map(fbCard).join('') : `<div class="empty">${st.ff === 'novo' ? 'Nenhuma mensagem nova. Tudo em dia ✨' : 'Nada por aqui.'}</div>`}</div>
      <section class="sec card" id="erros"><div class="sec-h"><div><h2>Erros do app</h2><p class="sub">O app avisa sozinho quando alguma coisa quebra pra uma creator. Últimos 30 dias.</p></div></div>
        ${(st.errs || []).length ? `<div class="list">${st.errs.map(e => `<div class="person wl"><div class="row1"><div style="min-width:0"><div class="err-row">${esc(e.msg)}</div>
          <div class="meta">${nf(e.n)} ${e.n === 1 ? 'vez' : 'vezes'} · ${nf(e.users)} ${e.users === 1 ? 'creator' : 'creators'} · último ${dtt(e.last_at)}${e.screens ? ' · tela: ' + esc(String(e.screens).split(', ').map(scr).join(', ')) : ''}</div></div></div></div>`).join('')}</div>
          <p class="note">Se um erro se repete, me manda print dessa lista que eu corrijo no app.</p>` : '<div class="empty">Nenhum erro registrado. 🎉</div>'}
      </section>`;
  }
  function fbCard(f) {
    const open = st.fopen === f.id;
    return `<article class="person wl"><div class="row1"><div style="min-width:0">
      <div class="nm">${esc(f.name || 'Sem nome')} <span class="pill${f.kind === 'erro' ? ' warn' : ''}">${FBK[f.kind] || f.kind}</span><span class="pill${f.status === 'resolvido' ? ' ok' : f.status === 'vendo' ? ' me' : ''}">${FBS[f.status]}</span></div>
      <div class="em pv">${esc(f.email || '')}</div><div class="meta">${dtt(f.created_at)}${f.screen ? ' · estava em: ' + esc(scr(f.screen)) : ''}${f.ua ? ' · ' + (/iPhone|iPad/.test(f.ua) ? 'iPhone' : /Android/.test(f.ua) ? 'Android' : 'computador') : ''}</div></div>
      <button class="btn ghost sm" data-fopen="${f.id}">${open ? 'Fechar' : f.reply ? 'Ver' : 'Responder'}</button></div>
      <div class="msg">${esc(f.message)}</div>
      ${f.reply ? `<div class="reply"><b>Sua resposta</b> · ${dtt(f.replied_at)}<br>${esc(f.reply)}</div>` : ''}
      ${open ? `<div style="margin-top:12px;display:grid;gap:8px"><textarea class="ta" id="freply" maxlength="2000" placeholder="Escreva sua resposta. Ela aparece pra creator em Ajustes › Fale com o CriaHub.">${esc(f.reply || '')}</textarea>
        <div class="planbox"><span class="seg" role="group" aria-label="Status">${Object.entries(FBS).map(([k, l]) => `<button data-fst="${k}" aria-pressed="${(st.fst || f.status) === k}">${l}</button>`).join('')}</span>
        <button class="btn sm" data-fsave="${f.id}">Salvar</button></div></div>` : ''}</article>`;
  }

  const METHODS = { pix: 'Pix', cartao: 'Cartão', google_play: 'Google Play', app_store: 'App Store', boleto: 'Boleto', outro: 'Outro' };
  const PERIODS = { mensal: 'Mensal', anual: 'Anual', avulso: 'Avulso' };
  function vFin() {
    const F = finStats(), R = st.rev || [];
    const months = Array.from({ length: 6 }, (_, i) => { const d = new Date(todayStr()); d.setDate(1); d.setMonth(d.getMonth() - (5 - i)); return d.toISOString().slice(0, 7); });
    const byM = months.map(m => R.filter(r => String(r.paid_at).slice(0, 7) === m).reduce((a, r) => a + Number(r.amount), 0)), mx = Math.max(1, ...byM);
    const mName = m => new Date(m + '-15').toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '');
    const byMethod = {}; R.forEach(r => { byMethod[r.method] = (byMethod[r.method] || 0) + Number(r.amount); });
    const users = (st.users || []).filter(u => !u.is_admin).sort((a, b) => (a.name || a.email).localeCompare(b.name || b.email));
    const venc = [...F.overdue, ...F.soon].sort((a, b) => String(a.plan_until).localeCompare(String(b.plan_until)));
    const kp = (l, v, d, hi) => `<div class="kpi${hi ? ' hi' : ''}"><div class="l">${l}</div><div class="v" style="font-size:24px">${v}</div>${d ? `<div class="d">${d}</div>` : ''}</div>`;
    return `<div class="sec-h"><div><h1>Finanças do CriaHub</h1><p class="sub">Quem está pagando, quanto entrou e quem vence. Registre aqui cada pagamento.</p></div>
      <button class="btn ghost sm" data-csv="rev">Baixar planilha</button></div>
      <div class="kpis">${kp('Recebido no mês', brl(F.month), '', true)}${kp('Mês passado', brl(F.last), F.last ? (F.month >= F.last ? '▲ ' : '▼ ') + Math.round(Math.abs(F.month - F.last) / F.last * 100) + '% este mês' : '')}
        ${kp('Receita recorrente', brl(F.mrr), 'por mês, com as Pro ativas')}${kp('Pro ativas', nf(F.active.length), F.overdue.length ? nf(F.overdue.length) + ' com pagamento vencido' : 'nenhuma vencida')}</div>
      <section class="sec card"><h2>Registrar pagamento</h2><p class="sub" style="margin-bottom:12px">Mensal ou anual de uma creator: ela vira Pro e a data de vencimento se ajusta sozinha.</p>
        <form id="payf" class="fgrid">
          <label>Creator<select name="user"><option value="">Outra pessoa (digitar nome)</option>${users.map(u => `<option value="${u.user_id}">${esc(u.name || u.email)}</option>`).join('')}</select></label>
          <label>Nome (se não tiver conta)<input name="payer" maxlength="120" placeholder="Ex.: Fulana"></label>
          <label>Valor (R$)<input name="amount" type="text" required placeholder="19,90" inputmode="decimal" pattern="[0-9]+([.,][0-9]{1,2})?"></label>
          <label>Data<input name="paid" type="date" required value="${todayStr()}"></label>
          <label>Forma<select name="method">${Object.entries(METHODS).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></label>
          <label>Período<select name="period">${Object.entries(PERIODS).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></label>
          <label style="grid-column:1/-1">Anotação<input name="note" maxlength="200" placeholder="Opcional. Ex.: cupom de lançamento"></label>
          <div><button class="btn" type="submit">Registrar</button></div></form></section>
      ${venc.length ? `<section class="sec"><h2>Vencimentos</h2><p class="sub" style="margin-bottom:12px">Pro vencido ou vencendo nos próximos 7 dias. Bom momento pra mandar um lembrete.</p><div class="list">${venc.map(u => `<div class="person pay"><div style="min-width:0"><div class="nm">${esc(u.name || u.email)}</div><div class="meta">${daysUntil(u.plan_until) < 0 ? 'venceu ' + dt(u.plan_until) : 'vence ' + dt(u.plan_until)}</div></div>
        ${u.whatsapp ? `<a class="btn ghost sm" style="display:inline-grid;place-items:center;text-decoration:none" href="https://wa.me/${waNum(u.whatsapp)}" target="_blank" rel="noopener">WhatsApp</a>` : `<a class="btn ghost sm" style="display:inline-grid;place-items:center;text-decoration:none" href="mailto:${esc(u.email)}">E-mail</a>`}<span class="pill warn">${daysUntil(u.plan_until) < 0 ? 'vencido' : daysUntil(u.plan_until) + ' dias'}</span></div>`).join('')}</div></section>` : ''}
      <div class="two sec">
        <section class="card"><h2>Últimos 6 meses</h2><div class="bars" style="height:150px">${byM.map((v, i) => `<div class="b" title="${brl(v)}"><i style="height:${Math.round(v / mx * 100)}%"></i></div>`).join('')}</div>
          <div class="bars-x">${months.map(mName).map(m => `<span>${m}</span>`).join('')}</div><p class="note">Total desde o começo: <b>${brl(F.total)}</b></p></section>
        <section class="card"><h2>Por forma de pagamento</h2><div class="rank" style="margin-top:12px">${Object.keys(byMethod).length ? Object.entries(byMethod).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="r"><span class="n">${METHODS[k] || k}</span><span class="m">${brl(v)}</span><span class="t"><i style="width:${Math.round(v / Math.max(1, F.total) * 100)}%"></i></span></div>`).join('') : '<p class="sub">Ainda sem pagamentos.</p>'}</div></section>
      </div>
      <section class="sec"><h2>Pagamentos</h2><div class="list" style="margin-top:12px">${R.length ? R.slice(0, 200).map(r => `<div class="person pay"><div style="min-width:0"><div class="nm">${esc(r.payer || '—')}</div><div class="meta">${dt(r.paid_at)} · ${METHODS[r.method] || r.method} · ${PERIODS[r.period] || r.period}${r.note ? ' · ' + esc(r.note) : ''}</div></div>
        <b class="v">${brl(r.amount)}</b><button class="btn danger sm${st.sure === r.id ? ' sure' : ''}" data-rmpay="${r.id}">${st.sure === r.id ? 'Confirmar' : 'Apagar'}</button></div>`).join('') : '<div class="empty">Nenhum pagamento registrado ainda. Quando a primeira creator pagar o Pro, registre aqui em cima.</div>'}</div></section>`;
  }

  /* ---------- planilhas ---------- */
  function csv(rows, name) {
    const s = rows.map(r => r.map(v => { const t = String(v ?? ''); return /[";\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; }).join(';')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + s], { type: 'text/csv;charset=utf-8' }));
    a.download = name + '-' + todayStr() + '.csv'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  const csvUsers = () => csv([['Nome', 'E-mail', 'Instagram', 'WhatsApp', 'Plano', 'Pago até', 'Já pagou', 'Entrou em', 'Último uso', 'Minutos (30 dias)', 'Dias ativos (30)', 'Mais usa', ...Object.values(COLS)],
    ...userList().map(u => [u.name, u.email, u.instagram ? '@' + u.instagram : '', u.whatsapp || '', u.plan === 'pro' ? 'Pro' : 'Grátis', u.plan_until ? dt(u.plan_until) : '', Number(u.paid_total || 0).toFixed(2).replace('.', ','), dt(u.created_at), u.last_seen ? dt(u.last_seen) : '', u.mins_30, u.days_30, scr(u.top_screen), ...Object.keys(COLS).map(k => (u.counts || {})[k] || 0)])], 'criahub-creators');
  const csvWl = () => csv([['Nome', 'E-mail', 'Instagram', 'WhatsApp', 'O que faz', 'O que mais atrapalha', 'Veio de', 'Entrou em', 'E-mail de boas-vindas'],
    ...wlList().map(w => [w.name, w.email, w.instagram, w.whatsapp, KINDS[w.kind] || '', w.pain, w.source, dtt(w.created_at), w.welcomed_at ? 'enviado' : ''])], 'criahub-lista-de-espera');

  const csvRev = () => csv([['Quem pagou', 'E-mail', 'Valor', 'Data', 'Forma', 'Período', 'Anotação'],
    ...(st.rev || []).map(r => [r.payer, r.email, Number(r.amount).toFixed(2).replace('.', ','), dt(r.paid_at), METHODS[r.method] || r.method, PERIODS[r.period] || r.period, r.note])], 'criahub-financas');

  /* ---------- ações ---------- */
  document.addEventListener('click', async e => {
    const t = e.target.closest('button, a'); if (!t) return;
    const d = t.dataset;
    if (t.closest('#tabs') && d.tab) { st.tab = d.tab; st.sure = null; try { sessionStorage.setItem('criahub:admtab', st.tab); } catch (_) {} render(); window.scrollTo(0, 0); return; }
    if (t.id === 'reload') { loadAll(); return; }
    if (t.id === 'disc') { const on = !document.body.classList.toggle('disc') ? false : true; t.setAttribute('aria-pressed', String(on)); try { localStorage.setItem('criahub:admdisc', on ? '1' : ''); } catch (_) {} toast(on ? 'Modo discreto ligado' : 'Modo discreto desligado'); return; }
    if (d.metric) { st.metric = d.metric; render(); return; }
    if (d.bar) { st.sel = +d.bar; render(); return; }
    if (d.uf) { st.uf = d.uf; render(); return; }
    if (d.csv) { d.csv === 'users' ? csvUsers() : d.csv === 'rev' ? csvRev() : csvWl(); return; }
    if (d.go) { const [tab, sub] = d.go.split(':'); st.tab = tab; if (tab === 'creators' && sub) st.uf = sub; if (tab === 'feedback') st.ff = 'novo'; render(); if (sub === 'erros') document.getElementById('erros')?.scrollIntoView(); else window.scrollTo(0, 0); return; }
    if (d.ff) { st.ff = d.ff; st.fopen = null; render(); return; }
    if (d.fopen) { st.fopen = st.fopen === d.fopen ? null : d.fopen; st.fst = null; render(); if (st.fopen) $('freply')?.focus(); return; }
    if (d.fst) { st.fst = d.fst; t.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === t))); return; }
    if (d.fsave) {
      const f = st.fb.find(x => x.id === d.fsave), reply = ($('freply') || {}).value?.trim() || '';
      const status = st.fst || (reply && reply !== (f.reply || '') ? 'resolvido' : f.status);
      t.disabled = true; const r = await sb.rpc('admin_feedback_update', { p_id: f.id, p_status: status, p_reply: reply || null }); t.disabled = false;
      if (r.error) { toast('Não consegui salvar.'); return; }
      f.status = status; if (reply && reply !== f.reply) { f.reply = reply; f.replied_at = new Date().toISOString(); }
      st.fopen = null; st.fst = null; toast(reply ? 'Resposta enviada pra ela 💌' : 'Salvo'); render(); return;
    }
    if (d.rmpay) {
      if (st.sure !== d.rmpay) { st.sure = d.rmpay; render(); setTimeout(() => { if (st.sure === d.rmpay) { st.sure = null; if (st.tab === 'financas') render(); } }, 4000); return; }
      t.disabled = true; const r = await sb.rpc('admin_delete_payment', { p_id: d.rmpay });
      if (r.error) { t.disabled = false; toast('Não consegui apagar.'); return; }
      st.rev = st.rev.filter(x => x.id !== d.rmpay); st.sure = null; toast('Pagamento apagado'); render(); return;
    }
    if (d.more !== undefined) { st.wlim += 50; render(); return; }
    if (d.open) {
      st.open = st.open === d.open ? null : d.open; render();
      if (st.open && !st.uscr[st.open]) { const id = st.open; const r = await sb.rpc('admin_user_screens', { p_user: id }); st.uscr[id] = r.error ? [] : r.data || []; if (st.tab === 'creators') render(); }
      return;
    }
    if (d.plan) { st.plan[st.open] = d.plan; t.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === t))); return; }
    if (d.saveplan) {
      const id = d.saveplan, u = st.users.find(x => x.user_id === id), plan = st.plan[id] || u.plan, note = ($('pnote') || {}).value?.trim() || null;
      t.disabled = true;
      const r = await sb.rpc('admin_set_plan', { p_user: id, p_plan: plan, p_note: note });
      t.disabled = false;
      if (r.error) { toast('Não consegui salvar. Tenta de novo.'); return; }
      if (u.plan !== plan) u.plan_since = new Date().toISOString();
      u.plan = plan; u.plan_note = note; delete st.plan[id];
      st.ov && (st.ov.pro = st.users.filter(x => x.plan === 'pro' && !x.is_admin).length);
      toast(plan === 'pro' ? 'Agora ela é Pro ✨' : 'Plano Grátis salvo'); render(); return;
    }
    if (d.rm) {
      if (st.sure !== d.rm) { st.sure = d.rm; render(); setTimeout(() => { if (st.sure === d.rm) { st.sure = null; if (st.tab === 'lista') render(); } }, 4000); return; }
      t.disabled = true;
      const r = await sb.rpc('admin_waitlist_remove', { p_id: d.rm });
      if (r.error) { t.disabled = false; toast('Não consegui remover.'); return; }
      st.wl = st.wl.filter(w => w.id !== d.rm); st.sure = null; if (st.ov) st.ov.waitlist = st.wl.length;
      toast('Removida da lista'); render(); return;
    }
  });
  document.addEventListener('submit', async e => {
    if (e.target.id !== 'payf') return; e.preventDefault();
    const f = e.target, user = f.user.value || null, amount = Number(String(f.amount.value).replace(',', '.'));
    if (!user && !f.payer.value.trim()) { toast('Escolha a creator ou digite o nome'); return; }
    if (!(amount >= 0)) { toast('Confere o valor'); return; }
    const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
    const r = await sb.rpc('admin_add_payment', { p_user: user, p_amount: amount, p_paid: f.paid.value, p_method: f.method.value, p_period: f.period.value, p_note: f.note.value.trim() || null, p_payer: f.payer.value.trim() || null });
    if (r.error) { btn.disabled = false; toast('Não consegui registrar.'); return; }
    const [rev, users] = await Promise.all([sb.rpc('admin_revenue'), sb.rpc('admin_users')]);
    if (!rev.error) st.rev = rev.data || []; if (!users.error) st.users = users.data || [];
    toast('Pagamento registrado 💸'); render();
  });
  document.addEventListener('input', e => {
    const q = e.target.dataset && e.target.dataset.q; if (!q) return;
    if (q === 'u') st.uq = e.target.value; else { st.wq = e.target.value; st.wlim = 50; }
    const pos = e.target.selectionStart; render();
    const el = document.querySelector(`[data-q="${q}"]`); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (_) {} }
  });
  document.addEventListener('change', e => {
    if (e.target.matches('[data-sort]')) { st.us = e.target.value; render(); }
    if (e.target.matches('[data-wk]')) { st.wk = e.target.value; st.wlim = 50; render(); }
  });
  sb && sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') showLogin('Sua sessão terminou. Entre de novo.'); });

  start();
})();
</script>
</body>
</html>
