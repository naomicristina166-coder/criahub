<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* CriaHub — versão própria (criahub.app.br)
   Liga o app ao Supabase: login, dados de cada creator, cotações e instalação.
   Os dados ficam protegidos por RLS: cada pessoa só lê e grava o que é dela. */
(() => {
  const cfg = window.CRIAHUB_CONFIG || {};
  window.CRIAHUB_STANDALONE = true;
  if (!window.supabase || !cfg.url || !cfg.key) { document.addEventListener('DOMContentLoaded', () => { document.body.insertAdjacentHTML('afterbegin', '<div style="padding:20px;background:#C2312F;color:#fff;font:600 15px system-ui">Configuração do CriaHub incompleta (config.js) ou sem internet.</div>'); }); return; }
  const sb = window.supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  window.criahubSupabase = sb;
  let session = null, readyRes; const ready = new Promise(r => { readyRes = r; });
  const uid = () => session.user.id;

  /* ---------- tela de login ---------- */
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let mode = 'entrar', msg = '', err = '', busy = false;
  const css = `.auth{position:fixed;inset:0;z-index:200;background:#420725;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto;font-family:var(--body,system-ui)}
  .auth .box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
  .auth .au-lg{font-family:var(--display,system-ui);font-weight:800;font-size:56px;letter-spacing:-.035em;line-height:.9;text-align:center;margin-bottom:6px}
  .auth .au-lg .a{color:#F4C9D8;display:block}.auth .au-lg .b{color:#fff;display:block}
  .auth .tg{text-align:center;color:rgb(255 255 255 / .75);font-weight:600;margin-bottom:8px}
  .auth .tabs2{display:grid;grid-template-columns:1fr 1fr;background:rgb(255 255 255 / .1);border-radius:12px;padding:4px}
  .auth .tabs2 button{border:0;background:none;color:#fff;font-weight:700;padding:9px;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}
  .auth .tabs2 button[aria-pressed=true]{background:#fff;color:#420725}
  .auth label{font-size:13px;font-weight:700;display:flex;flex-direction:column;gap:5px}
  .auth input{border:0;border-radius:11px;padding:12px;font:inherit;font-size:16px;color:#22141A;background:#fff;min-height:46px}
  .auth .go{border:0;border-radius:12px;background:#FF5C8A;color:#fff;font:inherit;font-weight:800;font-size:16px;padding:13px;cursor:pointer}
  .auth .go[disabled]{opacity:.6}
  .auth .lnk{background:none;border:0;color:#F4C9D8;font:inherit;font-weight:700;cursor:pointer;padding:4px;align-self:center}
  .auth .m{background:rgb(255 255 255 / .12);border-radius:12px;padding:10px 12px;font-size:14px}
  .auth .e{background:#C2312F;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
  .auth .sm{font-size:12.5px;color:rgb(255 255 255 / .7);text-align:center}`;
  function renderAuth() {
    let el = document.getElementById('auth');
    if (!el) { const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st); el = document.createElement('div'); el.id = 'auth'; el.className = 'auth'; document.body.appendChild(el); }
    const t = { entrar: 'Entrar', criar: 'Criar conta', esqueci: 'Recuperar senha', nova: 'Nova senha' }[mode];
    el.innerHTML = `<form class="box" id="authf" novalidate>
      <div class="au-lg" aria-label="criahub"><span class="a">cria</span><span class="b">hub</span></div><div class="tg">quem cria, se organiza.</div>
      ${mode === 'entrar' || mode === 'criar' ? `<div class="tabs2"><button type="button" data-am="entrar" aria-pressed="${mode === 'entrar'}">Entrar</button><button type="button" data-am="criar" aria-pressed="${mode === 'criar'}">Criar conta</button></div>` : `<b style="font-size:20px;text-align:center">${t}</b>`}
      ${err ? `<div class="e">${esc(err)}</div>` : ''}${msg ? `<div class="m">${esc(msg)}</div>` : ''}
      ${mode === 'criar' ? '<label>Seu nome<input name="name" autocomplete="given-name" required></label>' : ''}
      ${mode !== 'nova' ? '<label>E-mail<input name="email" type="email" autocomplete="email" inputmode="email" required></label>' : ''}
      ${mode === 'entrar' || mode === 'criar' || mode === 'nova' ? `<label>${mode === 'nova' ? 'Nova senha' : 'Senha'}<input name="pass" type="password" autocomplete="${mode === 'entrar' ? 'current-password' : 'new-password'}" minlength="6" required></label>` : ''}
      <button class="go" ${busy ? 'disabled' : ''}>${busy ? 'Aguarde…' : mode === 'esqueci' ? 'Enviar link' : mode === 'nova' ? 'Salvar senha' : t}</button>
      ${mode === 'entrar' ? '<button type="button" class="lnk" data-am="esqueci">Esqueci minha senha</button>' : mode === 'esqueci' ? '<button type="button" class="lnk" data-am="entrar">Voltar</button>' : ''}
      ${mode === 'criar' ? '<div class="sm">A senha precisa ter pelo menos 6 caracteres.</div>' : ''}
    </form>`;
  }
  const ptErr = e => { const m = String(e?.message || e || ''); if (/invalid login/i.test(m)) return 'E-mail ou senha incorretos.'; if (/email not confirmed/i.test(m)) return 'Confirme seu e-mail pelo link que enviamos antes de entrar.'; if (/already registered|already been registered/i.test(m)) return 'Esse e-mail já tem conta. Toque em Entrar.'; if (/password/i.test(m) && /6/.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.'; if (/rate|too many/i.test(m)) return 'Muitas tentativas. Espere alguns minutos e tente de novo.'; if (/fetch|network/i.test(m)) return 'Sem conexão. Confira sua internet.'; return 'Não deu certo: ' + m; };
  document.addEventListener('click', e => { const b = e.target.closest('[data-am]'); if (!b) return; mode = b.dataset.am; err = ''; msg = ''; renderAuth(); });
  document.addEventListener('submit', async e => {
    if (e.target.id !== 'authf') return; e.preventDefault(); e.stopImmediatePropagation();
    const f = e.target, v = n => (f.elements[n]?.value || '').trim(); err = ''; msg = '';
    if (mode !== 'nova' && !/^\S+@\S+\.\S+$/.test(v('email'))) { err = 'Digite um e-mail válido.'; return renderAuth(); }
    if ((mode === 'entrar' || mode === 'criar' || mode === 'nova') && v('pass').length < 6) { err = 'A senha precisa ter pelo menos 6 caracteres.'; return renderAuth(); }
    busy = true; renderAuth();
    try {
      if (mode === 'entrar') { const { error } = await sb.auth.signInWithPassword({ email: v('email'), password: f.elements.pass.value }); if (error) throw error; }
      else if (mode === 'criar') { try { localStorage.setItem('criahub:pendingName', v('name')); } catch (_) {} const { data, error } = await sb.auth.signUp({ email: v('email'), password: f.elements.pass.value, options: { data: { name: v('name') }, emailRedirectTo: location.origin + location.pathname } }); if (error) throw error; if (!data.session) { mode = 'entrar'; msg = 'Conta criada! Enviamos um link de confirmação para o seu e-mail. Depois de confirmar, entre aqui.'; } }
      else if (mode === 'esqueci') { const { error } = await sb.auth.resetPasswordForEmail(v('email'), { redirectTo: location.origin + location.pathname }); if (error) throw error; mode = 'entrar'; msg = 'Se esse e-mail tiver conta, enviamos um link para criar uma nova senha.'; }
      else if (mode === 'nova') { const { error } = await sb.auth.updateUser({ password: f.elements.pass.value }); if (error) throw error; document.getElementById('auth')?.remove(); if (session) readyRes(); }
    } catch (x) { err = ptErr(x); }
    busy = false; if (document.getElementById('auth')) renderAuth();
  }, true);

  sb.auth.onAuthStateChange((ev, s) => {
    if (ev === 'PASSWORD_RECOVERY') { session = s; mode = 'nova'; err = ''; msg = ''; renderAuth(); return; }
    if (ev === 'SIGNED_OUT') { location.reload(); return; }
    if (s && !session) { session = s; if (mode !== 'nova') { document.getElementById('auth')?.remove(); readyRes(); } }
  });
  sb.auth.getSession().then(({ data }) => {
    if (data.session) { if (!session) { session = data.session; } if (mode !== 'nova') readyRes(); }
    else { const go = () => renderAuth(); document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', go) : go(); }
  });

  /* ---------- dados ---------- */
  const cache = { profile: null, cols: {} }, subs = { profile: [], cols: {} };
  let loaded = null;
  const snapCol = c => ({ docs: [...(cache.cols[c] || new Map()).entries()].map(([id, d]) => ({ id, data: () => d })) });
  const snapProf = () => ({ exists: !!cache.profile, data: () => cache.profile || {} });
  const emitCol = c => (subs.cols[c] || []).forEach(cb => { try { cb(snapCol(c)); } catch (_) {} });
  const emitProf = () => subs.profile.forEach(cb => { try { cb(snapProf()); } catch (_) {} });
  const fail = error => Object.assign(new Error(error?.message || 'erro'), { code: /quota|limit/i.test(error?.message || '') ? 'quota_exceeded' : 'unavailable' });
  async function loadAll() {
    let from = 0;
    for (;;) { const { data, error } = await sb.from('items').select('id,col,data').eq('user_id', uid()).range(from, from + 999); if (error) throw fail(error); data.forEach(r => (cache.cols[r.col] ||= new Map()).set(r.id, r.data)); if (data.length < 1000) break; from += 1000; }
    const { data: p, error: pe } = await sb.from('profiles').select('data').eq('user_id', uid()).maybeSingle(); if (pe) throw fail(pe);
    cache.profile = p ? p.data : null;
    let pn = ''; try { pn = localStorage.getItem('criahub:pendingName') || ''; } catch (_) {}
    pn = pn || session.user.user_metadata?.name || '';
    if (pn && !(cache.profile && cache.profile.name)) { cache.profile = { ...(cache.profile || {}), name: pn }; await sb.from('profiles').upsert({ user_id: uid(), data: cache.profile, updated_at: new Date().toISOString() }); }
    try { localStorage.removeItem('criahub:pendingName'); } catch (_) {}
    sb.channel('criahub-' + uid())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'items', filter: 'user_id=eq.' + uid() }, pl => {
        if (pl.eventType === 'DELETE') { const id = pl.old?.id; for (const c of Object.keys(cache.cols)) if (cache.cols[c].delete(id)) emitCol(c); return; }
        const r = pl.new, m = (cache.cols[r.col] ||= new Map()); if (JSON.stringify(m.get(r.id)) === JSON.stringify(r.data)) return; m.set(r.id, r.data); emitCol(r.col);
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles', filter: 'user_id=eq.' + uid() }, pl => { if (pl.new && JSON.stringify(pl.new.data) !== JSON.stringify(cache.profile)) { cache.profile = pl.new.data; emitProf(); } })

  }
  const ensure = () => (loaded ||= loadAll());

  let fxP = null;

<body>

<style>
/* Layout: app shell — sidebar on desktop, top bar + bottom tab bar on phone; content is one focused column */
:root{
  --accent:#420725;
  --bg:#FAF6F7; --surface:#FFFFFF; --surface-2:#F4EDEF; --fg:#22141A; --muted:#76626C; --line:#E9DEE2;
  --rec:#FF5C8A; --ok:#2B7F55; --warn:#A86A12; --bad:#C2312F;
  --accent-ink:var(--accent);
  --logo-pink:#C9467A;
  --accent-btn:var(--accent);
  --accent-soft:color-mix(in oklab, var(--accent) 9%, var(--surface));
  --shadow:0 1px 2px rgb(66 7 37 / .06), 0 8px 24px -12px rgb(66 7 37 / .18);
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body:"Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150B10; --surface:#1F1219; --surface-2:#2A1922; --fg:#F5EAEF; --muted:#B49EA9; --line:#3A2530;
  --rec:#FF7AA0; --ok:#5CC48E; --warn:#E6A94A; --bad:#FF6B66;
  --accent-ink:color-mix(in oklab, var(--accent) 30%, #fff);
  --logo-pink:#F4C9D8;
  --accent-btn:color-mix(in oklab, var(--accent) 78%, #fff);
  --accent-soft:color-mix(in oklab, var(--accent) 38%, var(--surface));
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 10px 30px -14px rgb(0 0 0 / .6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#150B10; --surface:#1F1219; --surface-2:#2A1922; --fg:#F5EAEF; --muted:#B49EA9; --line:#3A2530;
  --rec:#FF7AA0; --ok:#5CC48E; --warn:#E6A94A; --bad:#FF6B66;
  --accent-ink:color-mix(in oklab, var(--accent) 30%, #fff);
  --logo-pink:#F4C9D8;
  --accent-btn:color-mix(in oklab, var(--accent) 78%, #fff);
  --accent-soft:color-mix(in oklab, var(--accent) 38%, var(--surface));
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 10px 30px -14px rgb(0 0 0 / .6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in oklab, var(--bg) 88%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);

.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;font-size:11px;font-weight:600;color:var(--muted)}

.tab[aria-current="page"] svg{stroke-width:2.2}

/* logo */
.logo{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.03em;color:var(--accent-ink);display:inline-flex;align-items:baseline;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent}
.logo .lc{color:var(--logo-pink);display:inline-flex;align-items:baseline}
.logo .lh{display:inline-flex;overflow:hidden;max-width:3em}
.logo.anim .lc{animation:lgNudge .5s ease both}
.logo.anim .lh{animation:lgOpen .75s cubic-bezier(.2,.8,.2,1) .45s both}
@keyframes lgNudge{from{transform:scale(.88);opacity:.25}to{transform:none;opacity:1}}
@keyframes lgOpen{from{max-width:0;opacity:0}to{max-width:3em;opacity:1}}

.logo .ii{position:relative;display:inline-block}
.logo .ii b{position:absolute;left:50%;top:-.02em;width:.26em;height:.26em;margin-left:-.13em;border-radius:50%;background:var(--rec);box-shadow:0 0 0 0 color-mix(in oklab, var(--rec) 50%, transparent);animation:rec 2.4s ease-out infinite}

  .side .tagline{font-size:12.5px;color:var(--muted);padding:0 10px 20px}
  .nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:0;background:none;font-weight:600;color:var(--muted);text-align:left}
  .nav svg{width:20px;height:20px}
  .nav:hover{background:var(--surface-2);color:var(--fg)}
  .nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
  .side .spacer{flex:1}
  .side .sync{font-size:12px;color:var(--muted);padding:6px 12px}
  main{padding-block:36px 60px}
}

/* ---------- common ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}

.list{display:flex;flex-direction:column;gap:8px}

/* home */

.idea{break-inside:avoid;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.idea .q{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.3}
.idea .n{font-size:13.5px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.idea .f{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* finance */
.month{display:flex;align-items:center;gap:6px}
.month b{font-family:var(--display);font-size:17px;min-width:150px;text-align:center}
.pay{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.pay .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pay .m{font-size:12.5px;color:var(--muted)}
.pay .amt{font-family:var(--display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;text-align:right}
.pay.paid .amt{color:var(--ok)}
.pay .open{background:none;border:0;padding:0;text-align:left;min-width:0}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:transparent}
.check svg{width:16px;height:16px}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.bybrand{display:flex;flex-direction:column;gap:10px}
.bb{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.bb .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bb .amt{font-variant-numeric:tabular-nums;font-weight:700}

/* forms / sheet */
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 12px;min-height:44px}
textarea{min-height:90px;resize:vertical}
input::placeholder,textarea::placeholder{color:color-mix(in oklab, var(--muted) 75%, transparent)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:700}
.field .hint{font-size:12px;color:var(--muted)}
.checkline{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}
.checkline input{width:20px;height:20px;accent-color:var(--accent-btn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scrim{position:fixed;inset:0;z-index:50;background:rgb(20 6 12 / .45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;
  padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px, env(safe-area-inset-left,0px));padding-right:max(18px, env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.sheet .sh{display:flex;justify-content:space-between;align-items:center}
.sheet h2{font-size:21px}
.sheet .foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;padding-top:4px}
.sheet .foot .r{display:flex;gap:8px;margin-left:auto}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:22px}}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
input[type=color]{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:900px){.toast{bottom:28px}}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:600;padding:30px 0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--rec);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
@media (max-width:420px){.stats{grid-template-columns:1fr 1fr}.stats .stat.hero{grid-column:1 / -1}.grid2{grid-template-columns:1fr}}

/* ---------- abertura ---------- */
.splash{position:fixed;inset:0;z-index:100;background:#420725;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;cursor:pointer;transition:transform .75s cubic-bezier(.7,0,.2,1)}
.splash.out{transform:translateY(-100%)}
.splash .sl{font-family:var(--display);font-weight:800;font-size:clamp(64px,19vw,112px);letter-spacing:-.035em;line-height:.9;display:flex;flex-direction:column;align-items:center}
.splash .sl .ln{display:flex}
.splash .sl .ln.a{color:#F4C9D8}
.splash .sl .ln.b{color:#fff}
.splash .sl .ln > span{display:inline-block;opacity:0;transform:translateY(.45em);animation:slIn .55s cubic-bezier(.2,.8,.2,1) forwards}
.splash .sl .ii{position:relative}
.splash .sl .ii b{position:absolute;left:50%;top:-.04em;width:.26em;height:.26em;margin-left:-.13em;border-radius:50%;background:#FF5C8A;opacity:0;transform:translateY(-2.4em) scale(.5);animation:dotDrop .65s cubic-bezier(.3,1.7,.5,1) .8s forwards,recPulse 1.6s ease-out 1.5s infinite}
@keyframes slIn{to{opacity:1;transform:none}}
@keyframes dotDrop{to{opacity:1;transform:none}}
@keyframes recPulse{0%{box-shadow:0 0 0 0 rgb(255 92 138 / .6)}70%{box-shadow:0 0 0 .35em rgb(255 92 138 / 0)}100%{box-shadow:0 0 0 0 rgb(255 92 138 / 0)}}
.splash .hi{text-align:center;max-width:30ch;opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease;display:flex;flex-direction:column;gap:6px;min-height:64px}
.splash .hi.on{opacity:1;transform:none}
.splash .hi b{font-family:var(--display);font-size:clamp(20px,5.5vw,26px);font-weight:700;letter-spacing:-.01em}
.splash .hi span{color:rgb(255 255 255 / .78);font-weight:600;font-size:15px}
@media (prefers-reduced-motion: reduce){.splash .sl .ln > span,.splash .sl .ii b{animation:none;opacity:1;transform:none}.splash{transition:opacity .3s}.splash.out{transform:none;opacity:0}}

/* ---------- animações de navegação ---------- */
.wrap.enter > *{animation:viewIn .42s cubic-bezier(.2,.8,.2,1) both}
.wrap.enter > *:nth-child(2){animation-delay:.04s}.wrap.enter > *:nth-child(3){animation-delay:.08s}.wrap.enter > *:nth-child(4){animation-delay:.12s}.wrap.enter > *:nth-child(5){animation-delay:.16s}.wrap.enter > *:nth-child(n+6){animation-delay:.2s}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.tab,.nav{position:relative;transition:color .2s ease}
.tab svg,.nav svg{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.tab.pop svg,.nav.pop svg{animation:tabPop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes tabPop{0%{transform:scale(1)}35%{transform:scale(.78) translateY(2px)}100%{transform:scale(1)}}
.tab::before{content:"";position:absolute;top:0;left:50%;width:0;height:3px;border-radius:0 0 3px 3px;background:var(--accent-btn);transform:translateX(-50%);transition:width .3s cubic-bezier(.2,.8,.2,1)}
.tab[aria-current="page"]::before{width:26px}
.btn,.chip,.adv,.check,.iconbtn,.stat,.seg button,.fronts button,.hb-btn,.tk-check{transition:transform .15s ease,background-color .2s ease,color .2s ease,box-shadow .2s ease}
.btn:active,.chip:active,.adv:active,.iconbtn:active,.seg button:active,.fronts button:active,.hb-btn:active{transform:scale(.95)}
.check.on,.tk-check.on{animation:checkPop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes checkPop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.sheet{animation:sheetUp .32s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.toast:not([hidden]){animation:toastIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){.wrap.enter > *,.tab.pop svg,.nav.pop svg,.check.on,.tk-check.on,.sheet,.toast:not([hidden]){animation:none}.btn:active,.chip:active,.adv:active,.iconbtn:active,.hb-btn:active{transform:none}}

/* ---------- estúdio, licenças, finanças ---------- */
.lic-acts{display:flex;flex-direction:column;gap:6px}
.daytype{display:flex;flex-direction:column;gap:2px;border-radius:var(--r);padding:12px 14px;font-size:14px}
.daytype.work{background:color-mix(in oklab, var(--warn) 12%, var(--surface));color:var(--fg)}
.daytype.work b{color:var(--warn)}
.daytype.free{background:color-mix(in oklab, var(--ok) 12%, var(--surface))}
.daytype.free b{color:var(--ok)}
.wk .d .wtag{font-style:normal;font-size:9.5px;font-weight:700;color:var(--warn);text-transform:lowercase;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wdchip{display:inline-flex;align-items:center;cursor:pointer;text-transform:capitalize}
.wdchip input{position:absolute;opacity:0;pointer-events:none}
.wdchip:has(input:checked){background:var(--fg);border-color:var(--fg);color:var(--bg)}
.wdchip:has(input:focus-visible){outline:2px solid var(--accent-ink);outline-offset:2px}
.bl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.bl{border-radius:12px;padding:10px 12px;background:var(--surface-2);font-size:14px}
.bl b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.bl ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.bl.ok b{color:var(--ok)}.bl.bad b{color:var(--bad)}.bl.ask b{color:var(--accent-ink)}
.ent{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.scenes-mini{margin:0;padding-left:20px;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.rule{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:8px}
.stack-bar{position:relative;height:12px;border-radius:7px;background:var(--surface-2);overflow:hidden}
.stack-bar span{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.stack-bar .g{background:color-mix(in oklab, var(--accent-btn) 35%, var(--surface-2))}
.stack-bar .r{background:var(--ok)}
.lg{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.lg.r{background:var(--ok)}.lg.g{background:color-mix(in oklab, var(--accent-btn) 35%, var(--surface-2))}
.pr-lines{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.pr-total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--accent-btn);color:#fff;border-radius:14px;padding:14px 16px}
.pr-total b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.tp{position:fixed;inset:0;z-index:120;background:#000;color:#fff;display:flex;flex-direction:column}
.tp-scroll{flex:1;overflow-y:auto;scrollbar-width:none;padding:0 max(20px, env(safe-area-inset-left,0px))}
.tp-text{padding:40vh 0 70vh;font-family:var(--body);font-weight:700;line-height:1.45;max-width:900px;margin:0 auto;text-align:center}
.tp-guide{position:fixed;left:0;right:0;top:calc(40vh + 4px);height:2px;background:rgb(255 92 138 / .5);pointer-events:none}
.tp-bar{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#111}
.tp-bar button{min-width:44px;height:44px;border-radius:12px;border:1px solid #333;background:#1c1c1c;color:#fff;font-weight:800;font-size:15px;display:grid;place-items:center;padding:0 10px}
.tp-bar button svg{width:20px;height:20px}
.tp-bar .main{background:#FF5C8A;border-color:transparent;min-width:96px}

/* ---------- novas funções ---------- */
.seg.ovf:not(.atend){-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pots{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.pots div{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.pots span{font-size:12px;color:var(--muted);font-weight:600}
.pots b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.das{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;background:color-mix(in oklab, var(--warn) 12%, var(--surface))}
.das.ok{background:color-mix(in oklab, var(--ok) 12%, var(--surface))}
.das div{display:flex;flex-direction:column}.das span{font-size:13px;color:var(--muted)}
.amt .charge{display:block;margin-left:auto;font-size:12px;margin-top:2px;color:var(--bad)}
.timerchip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:8px;background:var(--fg);color:var(--bg);border-radius:999px;padding:6px 6px 6px 14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);font-weight:700;font-size:14px}
.timerchip .tt{font-variant-numeric:tabular-nums}
.timerchip .tn{font-weight:500;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.timerchip button{border:0;border-radius:999px;background:var(--rec);color:#fff;font-weight:800;padding:7px 12px}
@media (min-width:900px){.timerchip{bottom:24px;left:calc(50% + 120px)}}
.alerts{display:flex;flex-direction:column;gap:0;padding:4px 16px}
.al{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.al:last-child{border-bottom:0}
.al div{display:flex;flex-direction:column;min-width:0}.al span{font-size:13px;color:var(--muted)}
.date-card{display:flex;flex-direction:column;gap:10px}
.date-card h3{font-size:18px}
.date-card.open{border-color:color-mix(in oklab, var(--warn) 50%, var(--line))}
.kitp{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--bg)}
.kitp p{margin:0}
.kh{display:flex;gap:12px;align-items:center}
.ka{width:52px;height:52px;border-radius:50%;background:var(--accent-btn);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:22px;font-weight:800;flex:none}
.kstat{font-family:var(--display);font-weight:700;color:var(--accent-ink)}
.views-row{display:grid;grid-template-columns:minmax(0,1fr) 130px 86px auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px}
.views-row .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.views-row .m{font-size:12.5px;color:var(--muted)}
.views-row select,.views-row input{min-height:38px;padding:6px 8px;font-size:13px}
@media (max-width:560px){.views-row{grid-template-columns:1fr 1fr auto}.views-row > div{grid-column:1 / -1}}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;opacity:.6}
.badge.on{opacity:1;border-color:color-mix(in oklab, var(--ok) 40%, var(--line))}
.badge .bi{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-weight:800;margin-bottom:4px}
.badge.on .bi{background:var(--ok);color:#fff;animation:checkPop .4s cubic-bezier(.3,1.6,.5,1)}
.badge .bi svg{width:20px;height:20px}
.badge b{font-size:14.5px}.badge span{font-size:12.5px;color:var(--muted)}.badge small{font-size:11.5px;color:var(--ok);font-weight:700}

.wn{border-color:color-mix(in oklab, var(--accent-btn) 40%, var(--line))}
.wn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wn-it{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;cursor:pointer}
.wn-it b{font-size:14px;color:var(--accent-ink)}.wn-it span{font-size:12px;color:var(--muted)}
/* ---------- moedas ---------- */
.curtabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.curtabs button{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;font-weight:700;color:var(--fg)}
.curtabs button span{grid-row:1 / 3;width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-size:15px;color:var(--accent-ink)}
.curtabs button small{font-size:12.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.curtabs button[aria-pressed="true"]{border-color:var(--accent-btn);box-shadow:0 0 0 1px var(--accent-btn) inset}
.curtabs button[aria-pressed="true"] span{background:var(--accent-btn);color:#fff}

/* ---------- ano ---------- */
.ychart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;height:170px;align-items:end}
.ycol{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;cursor:pointer;min-width:0}
.ystack{flex:1;width:100%;max-width:26px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:6px 6px 3px 3px;overflow:hidden;background:var(--surface-2)}
.ystack .g{background:var(--ok);display:block;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.ystack .p{background:color-mix(in oklab, var(--accent-btn) 35%, var(--surface-2));display:block}
.ycol small{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase}
.ycol.now small{color:var(--accent-ink)}
.ytable{display:flex;flex-direction:column;padding:6px 16px}
.yrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:14.5px;width:100%}
.yrow .mn{text-transform:capitalize;font-weight:700}
.yrow .num{font-variant-numeric:tabular-nums;font-weight:600}
.yrow.total{border-bottom:0;font-family:var(--display);font-size:17px}
.yrow.total .num:first-of-type{font-weight:800;color:var(--accent-ink)}

/* ---------- dólar ---------- */
.amt small.conv{display:block;font-family:var(--body);font-size:11.5px;font-weight:600;color:var(--muted);text-align:right}
.fx-top{display:flex;flex-direction:column;gap:4px;background:var(--accent-soft);border-color:transparent}
.fx-big{font-family:var(--display);font-weight:800;font-size:clamp(34px,9vw,44px);letter-spacing:-.03em;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.fx-mini{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;text-align:left;cursor:pointer;padding:12px 14px}
.fx-mini b{font-family:var(--display);font-size:18px;color:var(--accent-ink)}

/* ---------- radar ugc ---------- */
.ndot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rec);margin-left:auto;animation:recPulse 1.6s ease-out infinite}
.news-home{text-align:left;display:flex;flex-direction:column;gap:8px;cursor:pointer;width:100%;background:var(--accent-soft);border-color:transparent}
.news-home .q{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.25;color:var(--accent-ink)}
.news-top{background:var(--accent-btn);border-color:transparent;color:#fff;display:flex;flex-direction:column;gap:8px}
.news-top .eyebrow{color:rgb(255 255 255 / .75)}
.news-top h2{font-size:21px}
.news-top .news-why{background:rgb(255 255 255 / .12);color:#fff}
.news-top .news-why b{color:#fff}
.news{display:flex;flex-direction:column;gap:10px}
.news h3{font-size:18px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.news-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.news-sum{margin:0;color:var(--fg);overflow-wrap:anywhere}
.news-why{display:flex;flex-direction:column;gap:2px;background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14px}
.news-why b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.news-src{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;color:var(--accent-ink);text-decoration:none;align-self:flex-start}
.news-src svg{width:14px;height:14px}

/* ---------- rotina: dia, metas, hábitos, semana ---------- */
.day-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.day-nav b{font-family:var(--display);font-size:17px;min-width:170px;text-align:center}

  <div class="month"><button class="iconbtn" data-month="-1" aria-label="Mês anterior">${ic('left')}</button><b>${esc(label)}</b><button class="iconbtn" data-month="1" aria-label="Próximo mês">${ic('right')}</button></div>

function vExtras() {

  ${byArr.length ? `<section class="section"><div class="row-h"><h2>De onde vem seu dinheiro</h2></div><div class="card bybrand">${byArr.map(([k, v]) => `<div class="bb"><span class="name">${esc(k)}</span><div class="bar"><span style="width:${Math.round(v / max * 100)}%"></span></div><span class="amt">${brl(v)}</span></div>`).join('')}</div></section>` : ''}

/* ================= rotina: dia, metas, hábitos, semana ================= */
const RVIEWS = [['hoje', 'Meu dia'], ['metas', 'Metas'], ['habitos', 'Hábitos'], ['semana', 'Semana'], ['conquistas', 'Conquistas']];
const WD = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const WD_LONG = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const HABIT_SUGG = [
  { name: 'Beber água', kind: 'contagem', target: 8, unit: 'copos', remind: '60' },
  { name: 'Alongar entre gravações', kind: 'check', remind: '120' },
  { name: 'Fazer as refeições', kind: 'contagem', target: 3, unit: 'refeições', remind: '0' },
  { name: 'Dormir 7 horas ou mais', kind: 'check', remind: '0' },
  { name: 'Movimentar o corpo', kind: 'check', remind: '0' },
  { name: '1 hora sem tela antes de dormir', kind: 'check', remind: '0' },
  { name: 'Pegar um pouco de sol', kind: 'check', remind: '0' },
];
const GOAL_SUGG = ['Fechar 2 marcas novas', 'Publicar 12 vídeos no mês', 'Renovar o ciclo com todas as marcas', 'Faturar R$ 5.000 no mês'];
const weekStart = s => { const d = parse(s), wd = (d.getDay() + 6) % 7; return addDays(s, -wd); };
const hlogOf = (hid, date) => S.data.hlog.find(x => x.id === `${hid}_${date}`);
const hCount = (h, date) => +(hlogOf(h.id, date)?.count || 0);
const hTarget = h => h.kind === 'contagem' ? Math.max(1, +h.target || 1) : 1;
const hDone = (h, date) => hCount(h, date) >= hTarget(h);
const activeHabits = () => S.data.habits.filter(h => h.active !== false);
function streak(h) {
  let d = today(), n = 0;
  if (!hDone(h, d)) d = addDays(d, -1);
  while (hDone(h, d) && n < 400) { n++; d = addDays(d, -1); }
  return n;
}
const tasksOn = d => S.data.tasks.filter(t => t.date === d).sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0) || String(a.time || '99').localeCompare(String(b.time || '99')) || String(a.created || '').localeCompare(String(b.created || '')));
const lateTasks = () => S.data.tasks.filter(t => !t.done && t.date && t.date < today());
const dayLabel = s => { const dd = diff(today(), s); const base = parse(s).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'short' }).replace('.', ''); return dd === 0 ? 'Hoje' : dd === -1 ? 'Ontem' : dd === 1 ? 'Amanhã' : base.charAt(0).toUpperCase() + base.slice(1); };

function gcalUrl(t) {
  const tz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { return ''; } })();
  const ymd = s => s.replace(/-/g, '');
  let dates;
  if (t.time) { const [h, m] = t.time.split(':').map(Number); const st = new Date(parse(t.date)); st.setHours(h, m, 0, 0); const en = new Date(st.getTime() + 30 * 60000);
    const f = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`; dates = `${f(st)}/${f(en)}`; }
  else dates = `${ymd(t.date)}/${ymd(addDays(t.date, 1))}`;
  const p = new URLSearchParams({ action: 'TEMPLATE', text: t.title, dates, details: (t.notes ? t.notes + '\n\n' : '') + 'Criado no CriaHub · quem cria, se organiza.' });
  if (tz) p.set('ctz', tz);
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}

function tkRow(t, showDate) {
  const late = !t.done && t.date < today();
  return `<div class="tk ${t.done ? 'done' : ''}">
    <button class="tk-check ${t.done ? 'on' : ''}" data-tdone="${t.id}" aria-label="${t.done ? 'Desmarcar' : 'Concluir'} ${esc(t.title)}">${ic('check')}</button>
    <button class="open" data-edit="tasks:${t.id}"><span class="t">${esc(t.title)}</span>
      <span class="m">${t.time ? `<span class="time">${esc(t.time)}</span>` : ''}${showDate || late ? `<span style="${late ? 'color:var(--bad);font-weight:700' : ''}">${late ? 'era ' : ''}${esc(dayLabel(t.date).toLowerCase())}</span>` : ''}${t.brandId ? `<span>${esc(brandName(t.brandId))}</span>` : ''}${t.moved ? `<span>adiada ${t.moved}x</span>` : ''}</span></button>
    ${!t.done ? `<a class="gcal" href="${esc(gcalUrl(t))}" target="_blank" rel="noopener" title="Criar lembrete no Google Agenda">${ic('bell').replace('class="i"', 'class="i" style="width:13px;height:13px;vertical-align:-2px"')} Agenda</a>` : '<span></span>'}
  </div>`;
}

function hbRow(h, compact) {
  const t = today(), c = hCount(h, t), tg = hTarget(h), ok = c >= tg, st = streak(h);
  const days = Array.from({ length: 7 }, (_, i) => addDays(t, i - 6));
  const ctrl = h.kind === 'contagem'
    ? `<div class="hb-ctrl"><button class="hb-btn" data-hstep="${h.id}:-1" aria-label="Tirar 1" ${c ? '' : 'disabled style="opacity:.4"'}>${ic('minus')}</button><span class="hb-n">${c}/${tg}</span><button class="hb-btn ${ok ? 'on' : 'main'}" data-hstep="${h.id}:1" aria-label="Adicionar 1">${ic(ok ? 'check' : 'plus')}</button></div>`
    : `<button class="hb-btn ${ok ? 'on' : ''}" data-hstep="${h.id}:t" aria-label="${ok ? 'Desmarcar' : 'Marcar'} ${esc(h.name)}" style="width:44px;height:44px">${ic('check')}</button>`;
  return `<div class="hb ${ok ? 'ok' : ''}"><button class="open" data-edit="habits:${h.id}"><span class="t">${esc(h.name)}</span>
    <span class="m">${ok ? 'Feito hoje' : h.kind === 'contagem' ? `faltam ${tg - c} ${esc(h.unit || '')}` : 'ainda não hoje'}${st > 1 ? ` · ${st} dias seguidos` : ''}${+h.remind ? ` · lembrete a cada ${+h.remind >= 60 ? (+h.remind / 60) + 'h' : h.remind + ' min'}` : ''}</span>
    ${compact ? '' : `<span class="dots" aria-label="Últimos 7 dias">${days.map(d => { const cc = hCount(h, d); return `<i class="${cc >= tg ? 'on' : cc ? 'part' : ''}" title="${fmtD(d)}"></i>`; }).join('')}</span>`}
  </button>${ctrl}</div>`;
}

  return `<div class="head"><div><h1>Rotina</h1><div class="sub">${sub}</div></div>${btn}</div>
  <div class="seg" role="group" aria-label="Rotina">${RVIEWS.map(([k, l]) => `<button data-rview="${k}" aria-pressed="${rv === k}">${l}${k === 'hoje' && nLate ? `<span class="n">${nLate}</span>` : ''}</button>`).join('')}</div>

function goalCard(g) {

  const pct = num ? Math.min(100, Math.round(cur / tg * 100)) : done ? 100 : 0;

    ${num ? `<div class="big">${g.money ? brl(cur) : cur} <small>de ${g.money ? brl(tg) : tg + ' ' + unit}</small></div>` : ''}

const NUDGE = { seen: {}, snooze: {}, cur: null, t0: Date.now() };
function nudgeHtml() {
  const n = NUDGE.cur; if (!n) return '';
  return `<div class="nudge pulse" role="status"><div><b>${esc(n.title)}</b><div class="sub">${esc(n.sub)}</div></div><div class="row-btns"><button class="btn sm" data-nudge="ok">${esc(n.ok)}</button><button class="btn sm ghost" data-nudge="later">Depois</button></div></div>`;
}
function checkNudges() {
  if (S.loading) return;
  const now = Date.now(), t = today(), hm = `${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`;
  let next = null;
  for (const x of tasksOn(t)) {
    if (x.done || !x.time || x.time > hm || NUDGE.seen['t' + x.id] || (NUDGE.snooze['t' + x.id] || 0) > now) continue;
    next = { key: 't' + x.id, kind: 'task', id: x.id, title: `Agora: ${x.title}`, sub: `Marcado para ${x.time}.`, ok: 'Concluir' }; break;
  }
  if (!next) for (const h of activeHabits()) {
    const every = +h.remind; if (!every || hDone(h, t)) continue;
    const last = Math.max(NUDGE.t0, +(hlogOf(h.id, t)?.at || 0), NUDGE.snooze['h' + h.id] || 0);
    if (now - last < every * 60000) continue;
    next = { key: 'h' + h.id, kind: 'habit', id: h.id, title: h.name === 'Beber água' ? 'Hora de beber água' : `Lembrete: ${h.name}`, sub: h.kind === 'contagem' ? `${hCount(h, t)} de ${hTarget(h)} ${h.unit || ''} hoje.` : 'Ainda não marcado hoje.', ok: h.kind === 'contagem' ? '+1 agora' : 'Feito' }; break;
  }
  const changed = (next?.key || '') !== (NUDGE.cur?.key || '');
  NUDGE.cur = next;
  if (changed) { if (next && !['inicio', 'rotina'].includes(S.tab)) toast(next.title); if (!sheet) render(); }
}
setInterval(checkNudges, 30000);

async function habitStep(id, v) {
  const h = S.data.habits.find(x => x.id === id); if (!h) return;
  const t = today(), c = hCount(h, t), tg = hTarget(h);
  const n = v === 't' ? (c >= tg ? 0 : tg) : Math.max(0, c + Number(v));
  await put('hlog', { id: `${h.id}_${t}`, habitId: h.id, date: t, count: n, at: Date.now() });
  if (n >= tg && c < tg) toast(streak(h) > 1 ? `${h.name}: ${streak(h)} dias seguidos!` : `${h.name}: feito hoje!`);
}

let sheet = null;
function fieldHtml(f, obj) {
  const v = obj[f.k] ?? (typeof f.d === 'function' ? f.d() : f.d) ?? '';
  const id = `f_${f.k}`;
  const w = f.when ? ` data-when="${f.when}"` : '';
  if (f.t === 'check') return `<label class="checkline"${w}><input type="checkbox" id="${id}" name="${f.k}" ${v ? 'checked' : ''}>${f.l}</label>`;
  let inp;
  if (f.t === 'select') { const o = typeof f.o === 'function' ? f.o() : f.o; inp = `<select id="${id}" name="${f.k}">${o.map(([a, b]) => `<option value="${esc(a)}" ${String(v) === String(a) ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select>`; }
  else if (f.t === 'textarea') inp = `<textarea id="${id}" name="${f.k}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
  else inp = `<input type="${f.t}" id="${id}" name="${f.k}" value="${esc(v)}" ${f.ph ? `placeholder="${esc(f.ph)}"` : ''} ${f.req ? 'required' : ''} ${f.step ? `step="${f.step}"` : ''} ${f.t === 'number' ? 'inputmode="decimal" min="0"' : ''}>`;
  return `<div class="field"${w}><label for="${id}">${f.l}</label>${inp}${f.hint ? `<span class="hint">${f.hint}</span>` : ''}</div>`;
}
function openForm(col, id, preset = {}) {

  $('#layer').innerHTML = `<div class="scrim" data-scrim><form class="sheet" data-form="entity" role="dialog" aria-modal="true" aria-label="${id ? 'Editar' : 'Nova'} ${F.title}">

function readForm(form, col) {
  const out = {};
  const walk = fs => fs.forEach(f => { if (f.row) return walk(f.row); const el = form.elements[f.k]; if (!el) return;
    if (f.t === 'check') out[f.k] = el.checked; else if (f.t === 'number') out[f.k] = el.value === '' ? '' : Number(el.value); else out[f.k] = el.value.trim(); });
  walk(FORMS[col].fields); return out;
}
async function submitEntity(form) {
  const { col, id } = sheet, vals = readForm(form, col);
  const prev = id ? S.data[col].find(x => x.id === id) : null;
  const obj = { ...(prev || { id: newId(), created: new Date().toISOString() }), ...vals };
  if (col === 'brands') {
    const ct = obj.ctype || 'avulso';
    if (ct === 'ciclo' && !obj.end && obj.start) obj.end = addDays(obj.start, (+obj.cycle || 30) - 1);
    if (ct === 'avulso') { obj.start = ''; obj.end = ''; }
    const mk = obj.mkpay; delete obj.mkpay;
    closeForm(); await put('brands', obj);
    if (!prev && mk && ct !== 'avulso' && +obj.value > 0) await put('payments', { id: newId(), brandId: obj.id, desc: ct === 'ciclo' ? `${obj.name}: ciclo ${fmtD(obj.start)} a ${fmtD(obj.end)}` : `${obj.name}: pacote de ${+obj.videos || 0} vídeos`, amount: +obj.value, currency: obj.currency || 'BRL', due: obj.end || obj.start || today(), paid: false, created: new Date().toISOString() });
    toast(prev ? 'Marca atualizada' : 'Marca cadastrada'); return;
  }
  if (col === 'deliveries') {
    obj.stage = Number(obj.stage) || 0; const mk = obj.mkpay; delete obj.mkpay;
    closeForm(); await put(col, obj);
    const b = S.data.brands.find(x => x.id === obj.brandId);
    if (!prev && mk && b && ctypeOf(b) === 'avulso' && +b.value > 0) { await put('payments', { id: newId(), brandId: b.id, desc: `${b.name}: ${obj.title}`, amount: +b.value, currency: b.currency || 'BRL', due: obj.due || today(), paid: false, created: new Date().toISOString() }); toast('Entrega salva e cobrança criada'); }
    else toast('Salvo');
    return;
  }
  if (col === 'leads') { obj.updated = new Date().toISOString(); closeForm(); await put(col, obj); if (obj.stage === 'fechou' && prev?.stage !== 'fechou') await convertLead(obj); else toast('Salvo'); return; }
  if (col === 'payments') { if (obj.paid && !obj.paidAt) obj.paidAt = today(); if (!obj.paid) obj.paidAt = ''; }
  if (col === 'payments' || col === 'extras') { if (CURS[obj.currency] && obj.paid && !+obj.rate && fxRate(obj.currency)) obj.rate = fxNet(obj.currency); if (!obj.paid) obj.rate = ''; }
  if (col === 'goals') { const dn = obj.kind === 'check' ? !!obj.done : (+obj.current || 0) >= Math.max(1, +obj.target || 1); obj.doneAt = dn ? (obj.doneAt || today()) : ''; }
  if (col === 'tasks' && prev && prev.date !== obj.date && !obj.done && obj.date > prev.date) obj.moved = (prev.moved || 0) + 1;
  closeForm(); await put(col, obj); toast('Salvo');
}

async function renew(id) {
  const b = S.data.brands.find(x => x.id === id); if (!b) return; const ct = ctypeOf(b); if (ct === 'avulso') return;
  let start, end;
  if (ct === 'ciclo') { const days = +b.cycle || 30; start = b.end && b.end >= addDays(today(), -days) ? addDays(b.end, 1) : today(); end = addDays(start, days - 1); }
  else { start = today(); end = b.start && b.end ? addDays(start, Math.max(0, diff(b.start, b.end))) : ''; }
  await put('brands', { ...b, start, end, status: 'ativo' });
  if (+b.value > 0) await put('payments', { id: newId(), brandId: b.id, desc: ct === 'ciclo' ? `${b.name}: ciclo ${fmtD(start)} a ${fmtD(end)}` : `${b.name}: novo pacote de ${+b.videos || 0} vídeos`, amount: +b.value, currency: b.currency || 'BRL', due: end || start, paid: false, created: new Date().toISOString(), ...(b.example ? { example: true } : {}) });
  toast(ct === 'ciclo' ? `Ciclo renovado até ${fmtD(end)}` : 'Novo pacote aberto');
}
async function convertLead(l) {
  const ex = l.brandId && S.data.brands.find(b => b.id === l.brandId);
  if (ex) { await put('brands', { ...ex, status: 'ativo' }); toast(`${ex.name} voltou a ser cliente!`); return; }
  const front = leadFront(l);
  await put('brands', { id: newId(), name: l.name, contact: l.contact || '', front, status: 'ativo', ctype: defaultCtype(front), cycle: 30, start: today(), end: '', videos: '', value: l.value || '', currency: l.currency || 'BRL', notes: l.notes || '', created: new Date().toISOString(), ...(l.example ? { example: true } : {}) });
  toast(`${l.name} virou cliente! Complete os dados em Clientes.`);
}
async function advanceLead(id) {
  const l = S.data.leads.find(x => x.id === id); if (!l) return;
  const i = LEAD_STAGES.findIndex(x => x[0] === (l.stage || 'contatar')), nx = LEAD_STAGES[i + 1]?.[0]; if (!nx) return;
  await put('leads', { ...l, stage: nx, last: today(), next: LEAD_NEXT[nx] ? addDays(today(), LEAD_NEXT[nx]) : '', updated: new Date().toISOString() });
  if (nx === 'fechou') await convertLead(l); else toast(`${LEAD_STAGES[i + 1][1]}. Follow-up em ${fmtD(addDays(today(), LEAD_NEXT[nx]))}`);
}

  if (d.mview) { S.f.mview = d.mview; render(); return; }

document.addEventListener('input', e => {

document.addEventListener('keydown', e => { if ($('#tp')) { if (e.key === 'Escape') closePrompter(); else if (e.key === ' ') { e.preventDefault(); tpCmd('play'); } return; } if (e.key === 'Escape' && sheet) { closeForm(); applyAccent(); } });
document.addEventListener('submit', async e => {

  if (kind === 'kit') { const g = n => (f.elements[n]?.value || '').trim(); await saveProfile({ kit: { role: g('role'), city: g('city'), bio: g('bio'), niches: g('niches'), stats: g('stats'), videos: g('videos'), contact: g('contact'), langs: g('langs'), ig: g('ig'), tt: g('tt'), brands: [...f.querySelectorAll('input[name=kb]:checked')].map(x => x.value) } }); toast('Mídia kit salvo'); window.scrollTo(0, 0); return; }

  if (kind === 'addrule') { const r = f.elements.r.value.trim(); if (!r) return; await saveProfile({ rules: [...arr(S.profile.rules), r].slice(0, 20) }); return; }

  if (kind === 'settings') { const n = f.elements.name.value.trim(); const c = $('#s_color').value; const fr = [...new Set(f.elements.fronts.value.split(',').map(x => x.trim()).filter(Boolean))].slice(0, 6); const wm = f.elements.workMode.value, wd = [...f.querySelectorAll('input[name=wd]:checked')].map(x => +x.value); const ws = f.elements.workStart.value, wl = f.elements.workLabel.value.trim().slice(0, 30);
    closeForm(); await saveProfile({ name: n, accent: c, fronts: fr.length ? fr : DEFAULT_FRONTS, workMode: wm === 'semana' && !wd.length ? '' : wm === 'alternado' && !ws ? '' : wm, workDays: wd, workStart: ws, workLabel: wl, mei: f.elements.mei.checked, dasValue: +f.elements.dasValue.value || 86.05, meiLimit: +f.elements.meiLimit.value || 81000, potReserve: f.elements.potReserve.value === '' ? 0 : +f.elements.potReserve.value, potGear: f.elements.potGear.value === '' ? 0 : +f.elements.potGear.value, potTax: f.elements.potTax.value === '' ? 0 : +f.elements.potTax.value }); toast('Ajustes salvos'); }
});

/* ================= abertura + boas-vindas ================= */
function welcomeLine() {
  const t = today(), open = S.data.deliveries.filter(d => (d.stage || 0) < 5);
  const late = open.filter(d => d.due && d.due < t).length, now = open.filter(d => d.due === t).length;
  if (now) return `Você tem ${now} entrega${now > 1 ? 's' : ''} pra hoje.`;
  const tk = S.data.tasks.filter(x => x.date === t && !x.done).length;
  if (newsUnseen() && !tk) return 'Tem notícia nova no Radar UGC.';
  if (tk) return `${tk} tarefa${tk > 1 ? 's' : ''} no seu dia. Bora?`;
  if (late) return `Tem ${late} entrega${late > 1 ? 's' : ''} atrasada${late > 1 ? 's' : ''} te esperando.`;
  return 'Quem cria, se organiza.';
}
function splash() {
  try { if (sessionStorage.getItem('criahub:splash') === '1') return false; sessionStorage.setItem('criahub:splash', '1'); } catch (e) {}
  const el = document.createElement('div'); el.className = 'splash'; el.setAttribute('role', 'status');
  const L = (chars, off) => chars.map((ch, i) => ch === 'ı' ? `<span class="ii" style="animation-delay:${(i + off) * 60}ms">ı<b></b></span>` : `<span style="animation-delay:${(i + off) * 60}ms">${ch}</span>`).join('');
  el.innerHTML = `<div class="sl" aria-label="criahub"><div class="ln a">${L(['c', 'r', 'ı', 'a'], 0)}</div><div class="ln b">${L(['h', 'u', 'b'], 4)}</div></div><div class="hi"><b></b><span></span></div>`;
  document.body.appendChild(el);
  const t0 = Date.now(); let done = false;
  const finish = () => { if (done) return; done = true; el.classList.add('out'); setTimeout(() => el.remove(), 800); setTimeout(playLogo, 450); };
  el.addEventListener('click', finish);
  const showHi = () => {
    if (done) return;
    if (S.loading && Date.now() - t0 < 4000) { setTimeout(showHi, 150); return; }
    const name = S.profile.name, auth = !!S.authView, first = !auth && !S.profile.welcomed;
    el.querySelector('.hi b').textContent = auth ? 'Bem-vindo, cria!' : first ? 'Bem-vindo, cria!' : 'Bem-vindo de volta, cria!';
    el.querySelector('.hi span').textContent = auth ? 'quem cria, se organiza.' : first ? `${name ? name + ', aqui' : 'Aqui'} sua rotina de creator fica num lugar só.` : `${greeting()}${name ? ', ' + name : ''}. ${welcomeLine()}`;
    el.querySelector('.hi').classList.add('on');
    if (first) saveProfile({ welcomed: true });
    setTimeout(finish, first ? 2400 : 1800);
  };
  setTimeout(showHi, 1150);
  return true;
}

matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (themePref() === 'auto') { applyTheme(); if (!sheet) render(); } });

/* ================= boot ================= */
loadLocal(); applyAccent();
if (!window.claude) S.loading = false;
render();
if (!splash()) setTimeout(playLogo, 200);
connect();
})();
